[package]
name = "ghostleaf"
description = "Ghostleaf — a private, offline e-reader with stealth reading and realistic page curl"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# The app is a library (shared by the desktop executable and the Android .so)
# plus a thin desktop binary.
[lib]
name = "ghostleaf_app"
path = "src/lib.rs"

[[bin]]
name = "ghostleaf"
path = "src/main.rs"

[dependencies]
gl-core.workspace = true
gl-formats.workspace = true
gl-curl.workspace = true
serde.workspace = true
egui = "0.37"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
raw-window-handle = "0.6"

# Desktop only: window toolkit features, native file dialogs, global boss key, "open folder".
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
rfd = "0.18"
global-hotkey = "0.10"
opener = "0.9"

# Android: NativeActivity (phase 1); logcat output for diagnostics.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "android-native-activity"] }
android_logger = "0.15"
jni = "0.21"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
